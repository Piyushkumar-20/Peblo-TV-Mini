services:
  postgres:
    image: postgres:16-alpine
    container_name: peblo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peblo}
      POSTGRES_USER: ${POSTGRES_USER:-peblo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peblo_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peblo} -d ${POSTGRES_DB:-peblo}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: